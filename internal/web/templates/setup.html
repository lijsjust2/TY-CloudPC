{{template "header" .}}
<div class="auth-card">
  <div class="login-brand">TY CloudPC</div>
  <h1>欢迎使用</h1>
  <p class="muted">首次使用，请创建面板管理员账号</p>

  {{if .Error}}<div class="alert error">{{.Error}}</div>{{end}}

  <form method="post" action="/setup" class="auth-form">
    <div class="field">
      <label for="username">用户名</label>
      <input id="username" name="username" required maxlength="32" placeholder="请输入用户名" value="{{.FormUsername}}" autocomplete="username">
    </div>
    <div class="field">
      <label for="password">密码</label>
      <input id="password" type="password" name="password" required minlength="6" placeholder="请输入密码（至少 6 位）" autocomplete="new-password">
    </div>
    <div class="field">
      <label for="confirm_password">确认密码</label>
      <input id="confirm_password" type="password" name="confirm_password" required minlength="6" placeholder="请再次输入密码" autocomplete="new-password">
    </div>
    <button type="submit" class="btn primary full">创建管理员</button>
  </form>
</div>
{{template "footer" .}}
