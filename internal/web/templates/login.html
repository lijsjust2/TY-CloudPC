{{template "header" .}}
<div class="auth-card">
  <div class="login-brand">TY CloudPC</div>
  <p class="muted" id="loginSubtitle">{{.SubtitleText}}</p>

  {{if .Error}}<div class="alert error">{{.Error}}</div>{{end}}

  <form method="post" action="/login" class="auth-form" id="loginForm">
    <div class="field">
      <label for="username">账号</label>
      <input id="username" name="username" required placeholder="请输入账号" value="{{.FormUsername}}" autocomplete="username">
    </div>
    <div class="field">
      <label for="password">密码</label>
      <input id="password" type="password" name="password" required placeholder="请输入密码" autocomplete="current-password">
    </div>
    {{if .TwoFaEnabled}}
    <div class="field">
      <label for="code">验证码</label>
      <div class="code-row">
        <input id="code" name="code" required pattern="[0-9]{6}" inputmode="numeric" maxlength="6" placeholder="{{.CodePlaceholder}}" autocomplete="one-time-code">
        <button type="button" id="sendCodeBtn" class="btn" onclick="sendCode()">获取验证码</button>
      </div>
    </div>
    {{end}}
    <button type="submit" class="btn primary full">登录</button>
  </form>
</div>

<script>
const TWO_FA_ENABLED = {{.TwoFaEnabled}};

function cooldownBtn(btn, seconds, origText) {
  let left = seconds;
  btn.disabled = true;
  btn.textContent = origText + ' (' + left + 's)';
  const t = setInterval(() => {
    left--;
    if (left <= 0) { clearInterval(t); btn.disabled = false; btn.textContent = origText; return; }
    btn.textContent = origText + ' (' + left + 's)';
  }, 1000);
}

function showTip(msg, isErr) {
  const exist = document.getElementById('_tip');
  if (exist) exist.remove();
  const div = document.createElement('div');
  div.id = '_tip';
  div.className = 'alert ' + (isErr ? 'error' : 'success');
  div.style.marginBottom = '12px';
  div.textContent = msg;
  const form = document.getElementById('loginForm');
  form.parentElement.insertBefore(div, form);
}

async function sendCode() {
  const btn = document.getElementById('sendCodeBtn');
  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value;
  if (!u) { showTip('请先输入账号', true); return; }
  if (!p) { showTip('请先输入密码', true); return; }
  btn.disabled = true;
  btn.textContent = '发送中...';
  try {
    const r = await fetch('/login/send-code', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({ username: u, password: p }),
    });
    const j = await r.json();
    if (j.ok) {
      showTip('验证码已发送，请注意查收');
      cooldownBtn(btn, 60, '获取验证码');
    } else {
      showTip(j.error || '发送失败', true);
      btn.disabled = false;
      btn.textContent = '获取验证码';
    }
  } catch (e) {
    showTip('网络错误：' + e.message, true);
    btn.disabled = false;
    btn.textContent = '获取验证码';
  }
}

document.getElementById('loginForm').addEventListener('submit', function (e) {
  if (!TWO_FA_ENABLED) return;
  const codeField = document.getElementById('code');
  if (!codeField) return;
  const v = codeField.value.trim();
  if (!v) {
    e.preventDefault();
    showTip('请先点击"获取验证码"，再填入收到的验证码', true);
    return;
  }
});
</script>
{{template "footer" .}}
